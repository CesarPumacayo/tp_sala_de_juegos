<main class="form-signin w-100 m-auto">
<form (ngSubmit)="onSubmit()">

    @if(errorMensaje()){
        <div class="alert alert-danger">

            {{ errorMensaje() }}
            
        </div>
    }
    <img class="mb-4" src="https://cdn-icons-png.flaticon.com/512/1000/1000946.png" alt="" width="55" height="57" />
    <h1 class="h3 mb-3 fw-normal">Registro</h1>
    <div class="form-floating mb-2">

        <input type="text" [(ngModel)]="nombre" name="nombre" class="form-control" placeholder="Nombre" required>

        <label>Nombre</label>

    </div>

    <div class="form-floating mb-2">

        <input type="text" [(ngModel)]="apellido" name="apellido" class="form-control" placeholder="Apellido" required>

        <label>Apellido</label>

    </div>

    <div class="form-floating mb-2">

        <input type="number" [(ngModel)]="edad" name="edad" class="form-control" placeholder="Edad" required>

        <label>Edad</label>

    </div>

    <div class="form-floating mb-2">

        <input type="email" [(ngModel)]="email" name="email" class="form-control" placeholder="Email" required>

        <label>Email</label>

    </div>

    <div class="form-floating mb-3">

        <input type="password" [(ngModel)]="password" name="password" class="form-control" placeholder="Password" required>

        <label>Password</label>

    </div>
    <!-- <div class="form-check text-start my-3">
    <input class="form-check-input" type="checkbox" value="remember-me" id="checkDefault"/>
    <label class="form-check-label" for="checkDefault"> Remember me </label>
    </div> -->

    <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="loading()">

        @if(loading()) {
            Registrando...
        } @else {
            Registrarse
        }

    </button>

</form>

</main>
